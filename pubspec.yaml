name: karteji
description: Aplikasi Karang Taruna RT 01 - Platform Digital untuk Administrasi, Keuangan & Kegiatan
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_messaging: ^14.7.9
  firebase_storage: ^11.5.6
  
  # State Management
  provider: ^6.1.1
  
  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  intl: ^0.18.1
  
  # Image & File
  image_picker: ^1.0.7
  cloudinary_public: ^0.21.0
  file_picker: ^6.1.1
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # QR Code
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1
  
  # Utilities
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  url_launcher: ^6.2.2
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/logo.png"
  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: "assets/icons/logo.png"
